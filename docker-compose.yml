# Run on the VPS:  cp .env.example .env  (fill it in)  then  docker compose up -d --build
services:
  obsidian-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OBSIDIAN_MCP_PUBLIC_URL: https://${MCP_DOMAIN}
    volumes:
      - vault:/data/vault
      - vaults:/data/vaults  # extra vaults (OBSIDIAN_EXTRA_VAULTS)
      - state:/data/state
    # Not published on the host: only Caddy can reach it.
    expose:
      - "8000"
    mem_limit: 384m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - obsidian-mcp
    # Published on one address only (the server's public IP), never on every interface.
    ports:
      - "${MCP_BIND_IP:?set MCP_BIND_IP in .env to the public IP of this server}:80:80"
      - "${MCP_BIND_IP:?set MCP_BIND_IP in .env to the public IP of this server}:443:443"
    mem_limit: 128m
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/sites:ro  # optional extra routes (*.caddy), see the Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  vault:
  vaults:
  state:
  caddy_data:
  caddy_config:
