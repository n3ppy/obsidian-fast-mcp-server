[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-mcp"
version = "1.4"
description = "MCP server connecting Claude (Code, web, mobile) to a Git-synced Obsidian vault: notes, tags, backlinks, PDFs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "axel687" }]
dependencies = [
    "fastmcp>=4.2,<5",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
# The web dashboard at /dash (OBSIDIAN_MCP_DASHBOARD=true).
dashboard = [
    "python-fasthtml>=0.14,<0.15",
    "tzdata",  # time zones on systems without a zone database (slim images)
    # The note viewer (render/): markdown, code colours, and the sanitiser.
    "markdown-it-py>=4.3,<5",
    "mdit-py-plugins>=0.7,<0.8",
    "pygments>=2.21",
    "nh3>=0.3.8,<0.4",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]
